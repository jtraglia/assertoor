id: validator-flood-invalid-builder-per-slot
name: "GLOAS: Post-fork same-pubkey invalid validator flood, then invalid builders one per slot"
description: |
  Scenario 9 of the builder-deposit stress suite (a variation of scenario 8, s8).

  Runs entirely POST-GLOAS. Like scenario 8 (s8) but instead of a single final
  invalid 0x03 builder deposit, it sends invalid 0x03 builder deposits at a
  steady rate of ONE PER SLOT, sustained:

    1. `invalidValidatorDeposits` (default 50000) validator deposits with 0x01
       credentials, ALL targeting a single pubkey, each a different invalid sig.
    2. `finalBuilderDeposits` (default 128) invalid 0x03 builder deposits for
       that same pubkey, paced at one per slot.

  Every deposit targets a pubkey unknown to the registry and carries a wrong
  (well-formed) signature, so each fails its signature check at the pairing and
  its ETH is burned — no builder is ever onboarded. The one-per-slot builder
  deposits probe the sustained per-slot cost of processing an expensive
  same-pubkey invalid deposit, slot after slot.

  Requires the `reuseIndex` flag on generate_batch_deposits (assertoor fork)
  to pin every deposit to one derived key.

  Submission is fire-and-forget at the consensus layer (awaitReceipt only);
  awaitInclusion is NOT used because it tracks deposits by pubkey and cannot
  count same-pubkey deposits. The per-slot builder deposits are submitted only
  after the invalid validator deposits have EL receipts, so they sit behind
  them in the queue.

  Optional `skipForkActivationCheck` to bypass the GLOAS-epoch wait on
  long-running devnets.
version: 1.0.0
tags: [gloas, builder, deposit, eip-6110, postfork, same-pubkey, validator, per-slot, burn, stability]
timeout: 3h
config:
  walletPrivkey: ''
  depositContract: '0x00000000219ab540356cBB839Cbe05303d7705Fa'
  # Invalid-signature 0x01 validator deposits piled onto the single pubkey.
  invalidValidatorDeposits: 50000
  # Invalid 0x03 builder deposits to send afterwards, one per slot (raise for a
  # longer sustained run).
  finalBuilderDeposits: 128
  # Deposits per batch tx for the validator flood.
  batchSize: 220
  # Hard cap of in-flight batch txs so we don't drown the mempool.
  pendingBatches: 32
  # Deposits per slot for the validator flood. 8192 targets the per-block limit.
  perSlot: 8192
  # ETH per deposit. 1 ETH is the floor (MIN_DEPOSIT_AMOUNT).
  depositAmount: 1
  # Set true to skip waiting for the GLOAS fork to activate before spamming.
  skipForkActivationCheck: false
tasks:
  - name: check_clients_are_healthy
    title: Check that at least one client is ready
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: get_specs
    title: Get consensus chain specs
    if: "skipForkActivationCheck == false"

  - name: check_consensus_slot_range
    title: "Wait for GLOAS activation (epoch >= ${{ tasks.get_specs.outputs.specs.GLOAS_FORK_EPOCH }})"
    timeout: 1h
    if: "skipForkActivationCheck == false"
    configVars:
      minEpochNumber: "tasks.get_specs.outputs.specs.GLOAS_FORK_EPOCH"

  - name: check_consensus_block_proposals
    title: "Wait for block proposal to fix fee estimation"
    config:
      blockCount: 2
      checkLookback: 0

  - name: generate_child_wallet
    id: spam_wallet
    title: Generate funded wallet for the same-pubkey deposits
    config:
      walletSeed: validator-flood-invalid-builder-per-slot
    configVars:
      privateKey: walletPrivkey
      # (invalid validators + per-slot invalid builders) * depositAmount + 200 ETH headroom.
      prefundMinBalance: '| ((.invalidValidatorDeposits + .finalBuilderDeposits) * .depositAmount + 200) * 1000000000000000000'

  - name: get_random_mnemonic
    id: spam_mnemonic
    title: Generate fresh mnemonic for the pubkey (only index 0 is used)

  # Stage 1: invalidValidatorDeposits invalid 0x01 validator deposits, ALL
  # pinned to the index-0 pubkey, each with a fresh random invalid signature.
  # Deploys the batch contract used by both stages.
  - name: generate_batch_deposits
    id: invalid_validators
    title: Spam ${invalidValidatorDeposits} invalid 0x01 validator deposits for one pubkey
    timeout: 90m
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 100
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchSize: batchSize
      limitTotal: invalidValidatorDeposits
      limitPerSlot: perSlot
      limitPendingBatches: pendingBatches
      depositAmount: depositAmount
      # 0x01 eth1 withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0x01" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  # Stage 2: invalid 0x03 builder deposits for the SAME pubkey, one per slot
  # (batchSize 1, limitPerSlot 1), reusing the batch contract from stage 1.
  - name: generate_batch_deposits
    id: invalid_builders_per_slot
    title: Send ${finalBuilderDeposits} invalid 0x03 builder deposits for the same pubkey, one per slot
    timeout: 2h
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 100
      batchSize: 1
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchContract: tasks.invalid_validators.outputs.batchContract
      limitTotal: finalBuilderDeposits
      limitPerSlot: "| 1"
      depositAmount: depositAmount
      # 0x03 builder withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0x03" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  - name: check_consensus_finality
    title: Verify the chain still finalizes under the per-slot invalid-deposit load
    timeout: 30m
    config:
      minFinalizedEpochs: 1
      maxUnfinalizedEpochs: 4
      failOnCheckMiss: true
