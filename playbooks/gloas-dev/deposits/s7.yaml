id: builder-deposit-same-pubkey-validator-then-builder
name: "GLOAS: Post-fork same-pubkey invalid validators, then a valid validator, then a valid builder"
description: |
  Scenario 7 of the builder-deposit stress suite (a variation of scenario 6, s6).

  Runs entirely POST-GLOAS and drives a single pubkey through three stages,
  in this order:

    1. `invalidValidatorDeposits` (default 50000) validator deposits with 0x01
       credentials and invalid signatures (each different).
    2. Exactly ONE valid 0x01 validator deposit — onboards the pubkey as a
       regular validator.
    3. Exactly ONE valid 0x03 builder deposit for that same pubkey.

  All three stages target the same pubkey (same mnemonic, index 0). The 50k
  invalid deposits are burned as they process (unknown pubkey + bad signature).
  The valid 0x01 deposit then onboards the pubkey as a validator. The final
  0x03 deposit arrives for a pubkey that is ALREADY a validator — this is the
  edge case under test: a deposit for an existing validator is a balance
  top-up (signature skipped, withdrawal credentials ignored), so it should NOT
  convert the validator into a builder. The scenario checks the client handles
  this validator-then-builder collision on one pubkey without breaking
  finality, and that no builder is spuriously onboarded.

  Requires the `reuseIndex` flag on generate_batch_deposits (assertoor fork)
  to pin every deposit to one derived key.

  Submission is fire-and-forget at the consensus layer (awaitReceipt only);
  awaitInclusion is NOT used because it tracks deposits by pubkey and cannot
  count same-pubkey deposits. The stages run sequentially (each waits for EL
  receipts before the next), so queue order is invalid spam -> valid validator
  -> valid builder.

  Optional `skipForkActivationCheck` to bypass the GLOAS-epoch wait on
  long-running devnets.
version: 1.0.0
tags: [gloas, builder, deposit, eip-6110, postfork, same-pubkey, validator, topup, stability]
timeout: 2h
config:
  walletPrivkey: ''
  depositContract: '0x00000000219ab540356cBB839Cbe05303d7705Fa'
  # Invalid-signature 0x01 validator deposits piled onto the single pubkey.
  # Each burns `depositAmount` ETH.
  invalidValidatorDeposits: 50000
  # Deposits per batch tx (CL validates every BLS signature individually).
  batchSize: 220
  # Hard cap of in-flight batch txs so we don't drown the mempool.
  pendingBatches: 32
  # Deposits per slot. 8192 targets the per-block deposit limit.
  perSlot: 8192
  # ETH per deposit. 1 ETH is the floor (MIN_DEPOSIT_AMOUNT).
  depositAmount: 1
  # Set true to skip waiting for the GLOAS fork to activate before spamming.
  skipForkActivationCheck: false
tasks:
  - name: check_clients_are_healthy
    title: Check that at least one client is ready
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: get_specs
    title: Get consensus chain specs
    if: "skipForkActivationCheck == false"

  - name: check_consensus_slot_range
    title: "Wait for GLOAS activation (epoch >= ${{ tasks.get_specs.outputs.specs.GLOAS_FORK_EPOCH }})"
    timeout: 1h
    if: "skipForkActivationCheck == false"
    configVars:
      minEpochNumber: "tasks.get_specs.outputs.specs.GLOAS_FORK_EPOCH"

  - name: check_consensus_block_proposals
    title: "Wait for block proposal to fix fee estimation"
    config:
      blockCount: 2
      checkLookback: 0

  - name: generate_child_wallet
    id: spam_wallet
    title: Generate funded wallet for the same-pubkey deposits
    config:
      walletSeed: builder-deposit-same-pubkey-validator-then-builder
    configVars:
      privateKey: walletPrivkey
      # (invalid validators + 1 valid validator + 1 valid builder) * depositAmount + 200 ETH headroom.
      prefundMinBalance: '| ((.invalidValidatorDeposits + 2) * .depositAmount + 200) * 1000000000000000000'

  - name: get_random_mnemonic
    id: spam_mnemonic
    title: Generate fresh mnemonic for the pubkey (only index 0 is used)

  # Stage 1: invalidValidatorDeposits invalid 0x01 validator deposits, ALL
  # pinned to the index-0 pubkey, each with a fresh random invalid signature.
  # Deploys the batch contract used by all stages.
  - name: generate_batch_deposits
    id: invalid_validators
    title: Spam ${invalidValidatorDeposits} invalid 0x01 validator deposits for one pubkey
    timeout: 90m
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 100
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchSize: batchSize
      limitTotal: invalidValidatorDeposits
      limitPerSlot: perSlot
      limitPendingBatches: pendingBatches
      depositAmount: depositAmount
      # 0x01 eth1 withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0x01" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  # Stage 2: one VALID 0x01 validator deposit for the SAME pubkey — onboards it
  # as a regular validator. Reuses the batch contract from stage 1.
  - name: generate_batch_deposits
    id: valid_validator
    title: Submit the single valid 0x01 validator deposit for the same pubkey
    timeout: 15m
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 0
      batchSize: 1
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchContract: tasks.invalid_validators.outputs.batchContract
      limitTotal: "| 1"
      depositAmount: depositAmount
      # 0x01 eth1 withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0x01" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  # Stage 3: one VALID 0x03 builder deposit for the SAME pubkey — which is now
  # already a validator. Reuses the batch contract from stage 1.
  - name: generate_batch_deposits
    id: valid_builder
    title: Submit the single valid 0x03 builder deposit for the same (now-validator) pubkey
    timeout: 15m
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 0
      batchSize: 1
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchContract: tasks.invalid_validators.outputs.batchContract
      limitTotal: "| 1"
      depositAmount: depositAmount
      # 0x03 builder withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0x03" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  - name: check_consensus_finality
    title: Verify the chain still finalizes through the validator-then-builder collision
    timeout: 30m
    config:
      minFinalizedEpochs: 1
      maxUnfinalizedEpochs: 4
      failOnCheckMiss: true
